name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate version sync
        run: node scripts/validate-versions.js

      - name: Build and create release ZIPs
        run: npm run build:release

      - name: Verify build output
        run: |
          echo "Checking dist/ directory..."
          ls -lh dist/
          echo ""
          echo "Checking for ZIP files..."
          ls -lh dist/*.zip

      - name: Upload toast-player artifact
        uses: actions/upload-artifact@v4
        with:
          name: toast-player
          path: dist/toast-player-*.zip

      - name: Upload toast-studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: toast-studio
          path: dist/toast-studio-*.zip

  release:
    name: Create Releases
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download toast-player artifact
        uses: actions/download-artifact@v4
        with:
          name: toast-player
          path: ./artifacts

      - name: Download toast-studio artifact
        uses: actions/download-artifact@v4
        with:
          name: toast-studio
          path: ./artifacts

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -n "/## Version $VERSION/,/## Version/p" CHANGELOG.md | sed '$ d' > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Prepare Toast Player release
        run: |
          mkdir -p ./player-release
          unzip -j ./artifacts/toast-player-v${{ steps.get_version.outputs.VERSION }}.zip toast-player/module.json -d ./player-release
          cp ./artifacts/toast-player-v${{ steps.get_version.outputs.VERSION }}.zip ./player-release/toast-player.zip
          ls -lh ./player-release/

      - name: Prepare Toast Studio release
        run: |
          mkdir -p ./studio-release
          unzip -j ./artifacts/toast-studio-v${{ steps.get_version.outputs.VERSION }}.zip toast-studio/module.json -d ./studio-release
          cp ./artifacts/toast-studio-v${{ steps.get_version.outputs.VERSION }}.zip ./studio-release/toast-studio.zip
          ls -lh ./studio-release/

      - name: Create Toast Player versioned release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: toast-player-v${{ steps.get_version.outputs.VERSION }}
          name: Toast Player v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            ./player-release/module.json
            ./player-release/toast-player.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Toast Studio versioned release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: toast-studio-v${{ steps.get_version.outputs.VERSION }}
          name: Toast Studio v${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            ./studio-release/module.json
            ./studio-release/toast-studio.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Toast Player latest release
        if: ${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: toast-player-latest
          name: Toast Player (Latest)
          body: |
            **Latest Toast Player Release**

            Current Version: v${{ steps.get_version.outputs.VERSION }}

            This release is automatically updated to always point to the latest stable version.

            ## Installation

            Use this manifest URL in Foundry VTT:
            ```
            https://github.com/Ever-Onward-Games/toast/releases/download/toast-player-latest/module.json
            ```
          files: |
            ./player-release/module.json
            ./player-release/toast-player.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Toast Studio latest release
        if: ${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: toast-studio-latest
          name: Toast Studio (Latest)
          body: |
            **Latest Toast Studio Release**

            Current Version: v${{ steps.get_version.outputs.VERSION }}

            This release is automatically updated to always point to the latest stable version.

            **Note:** Toast Studio requires Toast Player to be installed.

            ## Installation

            Use this manifest URL in Foundry VTT:
            ```
            https://github.com/Ever-Onward-Games/toast/releases/download/toast-studio-latest/module.json
            ```
          files: |
            ./studio-release/module.json
            ./studio-release/toast-studio.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
